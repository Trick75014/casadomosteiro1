<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Casa do Mosteiro — Occupation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night:#1C2B2D; --terra:#C2714F; --terra-d:#A85A3A; --sand:#F5EFE6; --sand-d:#EDE3D5;
  --gold:#D4A853; --white:#FDFAF6; --leaf:#4A7C59; --ink-soft:#5B5348;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--sand); color:var(--night); line-height:1.45; }
.hdr { background:var(--night); padding:20px 18px 18px; }
.hdr-in { max-width:760px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
.hdr-sub { font-size:.72rem; color:var(--gold); font-weight:300; }
.hdr h1 { font-family:'Playfair Display',serif; font-weight:700; font-size:1.3rem; color:var(--sand); }
.hdr a { color:var(--sand); font-size:.85rem; text-decoration:underline; text-underline-offset:3px; }
.hdr a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
main { max-width:760px; margin:0 auto; padding:18px 14px 40px; }
section { background:var(--white); border-radius:14px; box-shadow:0 3px 18px rgba(0,0,0,.07); padding:18px 16px 16px; margin-bottom:16px; }
h2 { font-family:'Playfair Display',serif; font-size:1.1rem; margin-bottom:4px; }
.lead { font-size:.82rem; color:var(--ink-soft); margin-bottom:14px; max-width:60ch; }
.verdicts { list-style:none; display:grid; gap:12px; }
.v { display:grid; grid-template-columns:7.5rem 1fr auto; gap:10px; align-items:center; }
.v-m { font-weight:600; font-size:.9rem; text-transform:capitalize; }
.v-m small { display:block; font-weight:400; font-size:.7rem; color:var(--ink-soft); text-transform:none; }
.bar { position:relative; height:10px; background:var(--sand-d); border-radius:5px; }
.fill { position:absolute; left:0; top:0; bottom:0; background:var(--terra); border-radius:5px; }
.tick { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--night); }
.v-n { font-size:.78rem; margin-top:5px; color:var(--ink-soft); }
.chip { font-size:.74rem; font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap; }
.chip.up { background:#DDEDE3; color:#27553A; }
.chip.ok { background:var(--sand-d); color:var(--ink-soft); }
.chip.low { background:#F6E0D2; color:#7E3F20; }
.note { font-size:.72rem; color:var(--ink-soft); margin-top:12px; max-width:62ch; }
.hm { display:grid; grid-template-columns:5.2rem repeat(7,1fr); gap:3px; align-items:center; max-width:460px; }
.hm .h { font-size:.7rem; text-align:center; color:var(--ink-soft); padding-bottom:3px; }
.hm .h.we { color:var(--night); font-weight:700; border-bottom:2px solid var(--gold); }
.hm .w { font-size:.7rem; color:var(--ink-soft); }
.c { aspect-ratio:1; border-radius:4px; background:var(--sand-d); display:flex; align-items:center; justify-content:center; font-size:.62rem; color:var(--ink-soft); }
.c.on { background:var(--terra); color:var(--white); }
.c.past { opacity:.45; }
.c.today { outline:2px solid var(--night); outline-offset:1px; }
.key { display:flex; gap:14px; flex-wrap:wrap; font-size:.72rem; color:var(--ink-soft); margin-top:10px; }
.key i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
.gaps { list-style:none; display:grid; gap:8px; }
.gap { display:flex; justify-content:space-between; gap:10px; font-size:.86rem; border-bottom:1px solid var(--sand-d); padding-bottom:8px; }
.gap:last-child { border-bottom:0; padding-bottom:0; }
.gap span:last-child { color:var(--ink-soft); font-size:.78rem; text-align:right; }
.cols { display:flex; align-items:flex-end; gap:4px; height:120px; }
.col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
.col b { font-size:.62rem; font-weight:500; margin-bottom:3px; color:var(--ink-soft); }
.col div { width:100%; background:var(--terra); border-radius:4px 4px 0 0; min-height:2px; }
.col.fut div { background:var(--gold); }
.labels { display:flex; gap:4px; margin-top:5px; }
.labels span { flex:1; text-align:center; font-size:.62rem; color:var(--ink-soft); min-width:0; }
.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 16px; }
.fact b { display:block; font-family:'Playfair Display',serif; font-size:1.25rem; }
.fact span { font-size:.76rem; color:var(--ink-soft); }
.err { background:#F6E0D2; color:#7E3F20; padding:14px; border-radius:10px; font-size:.9rem; }
footer { font-size:.72rem; color:var(--ink-soft); text-align:center; padding:0 14px 28px; }
@media (max-width:520px) { .v { grid-template-columns:1fr auto; } .v .bar-wrap { grid-column:1 / -1; order:3; } }
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div><div class="hdr-sub">Portugal</div><h1>Casa do Mosteiro — occupation</h1></div>
  <a href="index.html">Retour au calendrier</a>
</div></div>
<main id="app"><section><p class="lead">Chargement des réservations…</p></section></main>
<footer>Cette page n’affiche aucun montant : seulement des dates et des nuits. Elle se met à jour avec l’Excel.</footer>

<script>
// ── Réglages (modifiables) ─────────────────────────────────────────
// Niveau d'occupation « attendu » selon le nombre de jours avant le début du mois.
// [jours avant le début du mois, % déjà réservé attendu]
const TARGETS = [[90,15],[60,25],[30,40],[14,55],[0,70]];
const MARGIN = 20;          // écart (en points) à partir duquel on parle de hausse ou de creux
const MONTHS_AHEAD = 6;     // mois affichés dans « À surveiller »

// ── Outils de date ─────────────────────────────────────────────────
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = (a,b) => Math.round((b-a)/86400000);
const dm = d => `${d.getDate()} ${MOIS_C[d.getMonth()]}`;
const q = new URLSearchParams(location.search).get('today');
const TODAY = q ? parse(q) : (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

(async () => {
  const app = document.getElementById('app');
  let data;
  try {
    const base = location.href.replace(/[^\/]*$/, '');
    const res = await fetch(base + 'reservas.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="err">Impossible de charger les réservations (reservas.json). Ouvre cette page depuis le site, pas depuis un fichier téléchargé.</div>';
    return;
  }

  // Une nuit est occupée si arrivée ≤ nuit < départ
  const occ = new Set();
  data.forEach(r => { for (let d = parse(r.checkin); d < parse(r.checkout); d = add(d,1)) occ.add(iso(d)); });
  const isOcc = d => occ.has(iso(d));
  const pct = x => Math.round(x*100);

  // ── 1. À surveiller : les prochains mois ─────────────────────────
  const targetFor = lead => (TARGETS.find(t => lead >= t[0]) || TARGETS[TARGETS.length-1])[1];
  const first = add(TODAY, 7);
  let ms = new Date(first.getFullYear(), first.getMonth(), 1);
  const rows = [];
  for (let i = 0; i < MONTHS_AHEAD; i++) {
    const start = new Date(ms.getFullYear(), ms.getMonth()+i, 1);
    const end = new Date(start.getFullYear(), start.getMonth()+1, 1);
    const from = start < TODAY ? TODAY : start;
    const days = diff(from, end);
    let booked = 0; for (let d = from; d < end; d = add(d,1)) if (isOcc(d)) booked++;
    const lead = Math.max(0, diff(TODAY, start));
    const target = targetFor(lead), p = pct(booked/days);
    const kind = p >= target + MARGIN ? 'up' : p <= target - MARGIN ? 'low' : 'ok';
    rows.push({ start, days, booked, lead, target, p, kind });
  }
  const label = { up:'Monter les prix', ok:'Dans la norme', low:'À animer' };
  const vHTML = rows.map(r => `
    <li class="v">
      <div class="v-m">${MOIS[r.start.getMonth()]} ${r.start.getFullYear()}<small>${r.lead === 0 ? 'en cours' : 'dans ' + r.lead + ' j'}</small></div>
      <span class="chip ${r.kind}">${label[r.kind]}</span>
      <div class="bar-wrap">
        <div class="bar" role="img" aria-label="${r.p} % réservé, niveau attendu ${r.target} %"><div class="fill" style="width:${r.p}%"></div><div class="tick" style="left:${r.target}%"></div></div>
        <div class="v-n">${r.booked} nuit${r.booked>1?'s':''} sur ${r.days} réservée${r.booked>1?'s':''} (${r.p} %) · attendu à cette date : ${r.target} %</div>
      </div>
    </li>`).join('');

  // ── 2. Les 12 prochaines semaines ────────────────────────────────
  const dow = (TODAY.getDay()+6)%7;
  const monday = add(TODAY, -dow);
  let hm = '<div></div>' + ['L','M','M','J','V','S','D'].map((l,i) => `<div class="h ${i>=4&&i<=5?'we':''}">${l}</div>`).join('');
  for (let w = 0; w < 12; w++) {
    const ws = add(monday, w*7);
    hm += `<div class="w">sem. du ${dm(ws)}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = add(ws, i), cls = ['c'];
      if (isOcc(d)) cls.push('on');
      if (d < TODAY) cls.push('past');
      if (+d === +TODAY) cls.push('today');
      hm += `<div class="${cls.join(' ')}" title="${dm(d)} : ${isOcc(d)?'nuit réservée':'libre'}">${d.getDate()}</div>`;
    }
  }

  // ── 3. Créneaux libres (120 jours) ───────────────────────────────
  const HORIZON = 120, hEnd = add(TODAY, HORIZON);
  const gaps = []; let g = null;
  for (let d = TODAY; d < hEnd; d = add(d,1)) {
    if (!isOcc(d)) { if (!g) g = { s:d, n:0 }; g.n++; g.e = add(d,1); }
    else if (g) { gaps.push(g); g = null; }
  }
  if (g) { g.open = true; gaps.push(g); }
  const gHTML = gaps.slice(0,7).map(x => {
    const range = x.open ? `libre à partir du ${dm(x.s)}` : `du ${dm(x.s)} au ${dm(x.e)}`;
    const tag = x.open ? 'rien de réservé ensuite sur 4 mois' : x.n <= 2 ? `${x.n} nuit${x.n>1?'s':''} : court, difficile à vendre` : `${x.n} nuits`;
    return `<li class="gap"><span>${range}</span><span>${tag}</span></li>`;
  }).join('') || '<li class="gap"><span>Aucun créneau libre sur 4 mois.</span></li>';

  // ── 4. Mois par mois (12 mois passés + à venir déjà réservés) ────
  const m0 = new Date(TODAY.getFullYear(), TODAY.getMonth()-11, 1);
  let cols = '', labs = '';
  for (let i = 0; i < 18; i++) {
    const s = new Date(m0.getFullYear(), m0.getMonth()+i, 1), e = new Date(s.getFullYear(), s.getMonth()+1, 1);
    const upto = e > TODAY && s < TODAY ? TODAY : e;       // mois en cours : jusqu'à aujourd'hui
    const fut = s >= TODAY;
    const den = diff(s, fut ? e : upto) || 1; let b = 0;
    for (let d = s; d < (fut ? e : upto); d = add(d,1)) if (isOcc(d)) b++;
    const p = pct(b/den);
    cols += `<div class="col ${fut?'fut':''}" title="${MOIS[s.getMonth()]} ${s.getFullYear()} : ${p} %"><b>${p}</b><div style="height:${Math.max(p,2)}%"></div></div>`;
    labs += `<span>${MOIS_C[s.getMonth()].replace('.','')}</span>`;
  }

  // ── 5. Nuits de la semaine (12 derniers mois) ────────────────────
  const from12 = add(TODAY, -365), tot = Array(7).fill(0), bk = Array(7).fill(0);
  for (let d = from12; d < TODAY; d = add(d,1)) { const k = (d.getDay()+6)%7; tot[k]++; if (isOcc(d)) bk[k]++; }
  const JOURS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  const wd = bk.map((b,i) => pct(b/(tot[i]||1)));
  const best = wd.indexOf(Math.max(...wd)), worst = wd.indexOf(Math.min(...wd));
  const wCols = wd.map((p,i) => `<div class="col"><b>${p}</b><div style="height:${Math.max(p,2)}%"></div></div>`).join('');
  const wLabs = JOURS.map(j => `<span>${j.slice(0,3)}.</span>`).join('');

  // ── 6. Repères ───────────────────────────────────────────────────
  const stays = data.map(r => diff(parse(r.checkin), parse(r.checkout))).filter(n => n > 0);
  const avgN = stays.length ? (stays.reduce((a,b)=>a+b,0)/stays.length) : 0;
  const avgG = data.length ? data.reduce((a,r)=>a+(+r.guests||0),0)/data.length : 0;
  const nb = {}; data.forEach(r => { const p = r.platform || 'Autre'; nb[p] = (nb[p]||0)+1; });
  const platforms = Object.entries(nb).sort((a,b)=>b[1]-a[1]).map(([p,n]) => `${p} ${pct(n/data.length)} %`).join(' · ');
  let last = 0; for (let d = from12; d < TODAY; d = add(d,1)) if (isOcc(d)) last++;
  const f1 = n => n.toLocaleString('fr-FR',{maximumFractionDigits:1});

  app.innerHTML = `
  <section>
    <h2>À surveiller</h2>
    <p class="lead">Où en sont les prochains mois par rapport à ce qu’on attend à la même distance. Le trait noir marque le niveau attendu.</p>
    <ul class="verdicts">${vHTML}</ul>
    <p class="note">Repère indicatif : « Monter les prix » si le mois est rempli ${MARGIN} points au-dessus du niveau attendu, « À animer » s’il est ${MARGIN} points en dessous. Les niveaux attendus sont réglables en haut du fichier stats.html.</p>
  </section>
  <section>
    <h2>Les 12 prochaines semaines</h2>
    <p class="lead">Chaque case est une nuit. Les vendredis et samedis sont soulignés : un week-end vide est le premier endroit où ajuster.</p>
    <div class="hm">${hm}</div>
    <div class="key"><span><i style="background:var(--terra)"></i>nuit réservée</span><span><i style="background:var(--sand-d)"></i>libre</span><span><i style="background:var(--sand-d);outline:2px solid var(--night)"></i>aujourd’hui</span></div>
  </section>
  <section>
    <h2>Créneaux libres</h2>
    <p class="lead">Les trous entre deux séjours dans les 4 prochains mois.</p>
    <ul class="gaps">${gHTML}</ul>
  </section>
  <section>
    <h2>Mois par mois</h2>
    <p class="lead">Part des nuits occupées, en %. En doré : les mois à venir, déjà réservés à ce jour.</p>
    <div class="cols">${cols}</div><div class="labels">${labs}</div>
  </section>
  <section>
    <h2>Quelles nuits se remplissent</h2>
    <p class="lead">Sur les 12 derniers mois, c’est la nuit de ${JOURS[best]} qui se remplit le plus (${wd[best]} %) et celle de ${JOURS[worst]} le moins (${wd[worst]} %).</p>
    <div class="cols" style="height:100px">${wCols}</div><div class="labels">${wLabs}</div>
  </section>
  <section>
    <h2>Repères</h2>
    <div class="facts">
      <div class="fact"><b>${pct(last/365)} %</b><span>des nuits occupées sur 12 mois</span></div>
      <div class="fact"><b>${f1(avgN)} nuits</b><span>durée moyenne d’un séjour</span></div>
      <div class="fact"><b>${f1(avgG)}</b><span>personnes par réservation</span></div>
    </div>
    <p class="note">Réservations par plateforme : ${platforms || '—'}</p>
  </section>`;
})();
</script>
</body>
</html>
